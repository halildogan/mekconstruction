services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mek-construction
    container_name: mek-construction
    restart: unless-stopped
    # Bound to localhost only: public traffic arrives through Cloudflare Tunnel
    # (cloudflared → http://127.0.0.1:9060). Do not expose this port publicly.
    ports:
      - "127.0.0.1:9060:9060"
    # Runtime configuration and secrets. Copy .env.example → .env.local and fill in.
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
    volumes:
      # Private storage for uploaded tender documents and submission records.
      - mek-data:/app/.data

volumes:
  mek-data:
